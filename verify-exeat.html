<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Verify Exeat Pass | Edo State University</title>
    <link rel="icon" type="image/png" href="eui%20logo.png">
    <link rel="stylesheet" href="css/style.css?v=20261101-exeat-slip-dates">
</head>
<body>
    <main class="pass-verification-page">
        <section class="pass-verification-card" aria-labelledby="verificationTitle">
            <img class="pass-verification-logo" src="eui logo.png" alt="Edo State University logo">
            <p class="pass-verification-eyebrow">EDO STATE UNIVERSITY, UZAIRUE</p>
            <h1 id="verificationTitle">Exeat Pass Verification</h1>
            <p class="pass-verification-intro">This verification is available to signed-in security officers only.</p>
            <div id="verificationResult" class="pass-verification-result" role="status" aria-live="polite">
                <span class="pass-verification-indicator" aria-hidden="true"></span>
                <span id="verificationMessage">Checking permission slip...</span>
            </div>
            <dl id="verificationDetails" class="pass-verification-details" hidden></dl>
            <a class="pass-verification-back" href="security.html">Return to Security Portal</a>
        </section>
    </main>
    <script type="module" src="javascript/verify-exeat.js?v=20261101-exeat-slip-dates"></script>
</body>
</html>
