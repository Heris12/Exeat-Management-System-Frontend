<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Exeat System || Requests History</title>
    <link rel="icon" type="image/png" href="eui%20logo.png">
    <link rel="stylesheet" href="css/style.css?v=20261101-exeat-slip">
    <script src="javascript/preloader.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <div class="page-preloader" id="page-preloader" role="status" aria-label="Loading School Exeat System">
        <div class="page-preloader__mark">
            <span class="page-preloader__spinner" aria-hidden="true"></span>
            <img class="page-preloader__logo" src="eui logo.png" alt="Edo State University logo">
        </div>
        <span class="page-preloader__label">LOADING...</span>
    </div>
    <div class="dashboard">
        <!-- Hamburger Icon -->
        <button class="menu-icon" id="menu-icon" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sidebar">
            <i class="fa-solid fa-bars"></i>
        </button>
        <aside class="sidebar" id="sidebar">
             <!-- Navigation Links -->
            <button class="close-icon" id="close-icon" aria-label="Close navigation menu">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="logo">
                <img src="eui logo.png" alt="Edo State University logo">
            </div>
            <h2>Exeat System</h2>
            <a href="dashboard.html" class="active"><i class="fa-solid fa-shield" aria-hidden="true"></i> Dashboard</a>
            <a href="request-exeat.html"><i class="fa fa-file-text" aria-hidden="true"></i> Request Exeat</a>
            <a href="requests.html"><i class="fa fa-history" aria-hidden="true"></i> My Requests</a>
            <a href="index.html" class="logout" id="logoutBtn">Logout <i class="fa-solid fa-right-from-bracket"></i></a>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <div>
                    <h1>Request History</h1>
                    <p>View and manage all your previous exeat requests.</p>
                </div>
            </div>
            <div class="recent-requests">
                <table>
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>Destination</th>
                            <th>Hostel Hall</th>
                            <th>Departure</th>
                            <th>Return</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th id="adminCommentHeader" hidden>Admin Comment</th>
                        </tr>
                    </thead>
                    <tbody id="allRequests"></tbody>
                </table>
            </div>
            <section class="recent-requests approved-exeats" aria-labelledby="approvedExeatsHeading">
                <h2 id="approvedExeatsHeading">Approved exeats</h2>
                <div id="approvedExeatList" class="approved-exeat-list"></div>
            </section>
        </main>
    </div>
    <script type="module" src="javascript/scripts.js?v=20261101-exeat-slip"></script>
    
</body>
</html>
