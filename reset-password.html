<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f8ff">
    <title>Reset Password | School Exeat System</title>
    <link rel="icon" type="image/png" href="eui%20logo.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="login-container recovery-page">
        <section class="login-card recovery-card" aria-labelledby="recoveryTitle">
            <a class="recovery-brand" href="index.html" aria-label="School Exeat System home">
                <img src="eui logo.png" alt="Edo State University logo">
                <span>EDO STATE UNIVERSITY</span>
            </a>

            <div class="recovery-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M7.5 10V7.5a4.5 4.5 0 0 1 9 0V10m-9.75 0h10.5c.83 0 1.5.67 1.5 1.5v7c0 .83-.67 1.5-1.5 1.5H6.75c-.83 0-1.5-.67-1.5-1.5v-7c0-.83.67-1.5 1.5-1.5Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 14v2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
            </div>

            <p class="recovery-eyebrow">ACCOUNT SECURITY</p>
            <h1 id="recoveryTitle">Reset your password</h1>
            <p class="recovery-description" id="recoveryDescription">
                Use a secure reset link to choose a new password for your account.
            </p>

            <form id="resetPasswordForm" class="recovery-form" hidden>
                <div class="recovery-field">
                    <label for="newPassword">New password</label>
                    <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" minlength="6" placeholder="Enter at least 6 characters" required>
                </div>
                <div class="recovery-field">
                    <label for="confirmPassword">Confirm new password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="6" placeholder="Enter your password again" required>
                </div>
                <p class="recovery-hint">Use at least 6 characters for your new password.</p>
                <button type="submit" id="resetPasswordButton">Update password</button>
            </form>

            <a class="recovery-back" href="index.html">
                <span aria-hidden="true">&larr;</span>
                Back to login
            </a>
        </section>
        <p class="recovery-footer">Secure access to Edo State University, Iyamho</p>
    </main>
    <script type="module" src="javascript/scripts.js?v=20261031-2"></script>
</body>
</html>
