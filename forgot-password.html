<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Exeat System || Password Recovery</title>
    <link rel="icon" type="image/png" href="eui%20logo.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="login-container recovery-page">
        <section class="login-card recovery-card">
            <div class="logo recovery-logo">
                <img src="eui logo.png" alt="Edo State University logo">
            </div>
            <h1>Reset Password</h1>
            <p class="recovery-description">Enter your email to receive a password reset link.</p>
            <form id="requestResetForm" class="recovery-request-form">
                <label for="resetEmail">Email Address</label>
                <input type="email" id="resetEmail" name="email" autocomplete="email" placeholder="you@example.com" required>
                <button type="submit" id="requestResetButton">Send reset link</button>
            </form>
            <p class="register-text"><a href="index.html">Back to login</a></p>
        </section>
    </main>
    <script type="module" src="javascript/scripts.js?v=20261031-3"></script>
</body>
</html>
