<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Exeat System || Register</title>
    <link rel="icon" type="image/png" href="eui%20logo.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>School Exeat System</h1>
            <p>Register as a student</p>
            <form id="registerForm">
                <input type="text" id="fullName" placeholder="Full Name" required>
                <input type="text" id="matricNumber" placeholder="Matriculation Number" required>
                <input type="text" id="department" placeholder="Department" required>
                <input type="email" id="registerEmail" placeholder="Email Address" required>
                <input type="password" id="registerPassword" placeholder="Password" required>
                <button type="submit">Create Account</button>
            </form>
            <p class="register-text">Already have an account? <a href="index.html">Login</a></p>
        </div>
    </div>
    <script type="module" src="javascript/scripts.js?v=20261016-2"></script>
</body>
</html>
