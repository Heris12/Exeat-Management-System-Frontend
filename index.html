<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Exeat System || Login</title>
    <link rel="icon" type="image/png" href="eui%20logo.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <img src="eui logo.png" alt="">
            </div>
            <h1>School Exeat System</h1>
            <p>Edo State University, Iyamho</p>
            <form id="loginForm">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
                <button type="submit">Login</button>
            </form>
            <p class="register-text">Don't have an account? <a href="register.html">Register</a></p>
        </div> 
    </div>
    
    <script type="module" src="javascript/scripts.js?v=20261016-2"></script>
</body>
</html>
