<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Exeat System || Login</title>
    <link rel="icon" type="image/png" href="eui%20logo.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <img src="eui logo.png" alt="">
            </div>
            <h1>School Exeat System</h1>
            <p>Edo State University, Iyamho</p>
            <form id="loginForm">
                <label for="identifier">Staff/Student ID:</label>
                <input type="text" id="identifier" name="identifier" placeholder="Enter your email or student matric number" autocomplete="username" required>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                <button type="submit" id="loginButton">Login</button>
            </form>
            <p class="register-text"><a href="forgot-password.html">Forgot password?</a></p>
        </div> 
    </div>
    
    <script type="module" src="javascript/scripts.js?v=20261025-6"></script>
</body>
</html>
